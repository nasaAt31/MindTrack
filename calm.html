
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calm Mode</title>
<link rel="stylesheet" href="./css/style.css">

<style>
body{
    margin:0;
    font-family:Arial;
}

/* CALM CENTER */
.calm-container{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background: linear-gradient(135deg, #e0f2fe, #f1f8ff);
    text-align:center;
}

.breath-circle{
    width:180px;
    height:180px;
    border-radius:50%;
    background: rgba(255,255,255,0.6);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:60px;
    animation: breathe 4s infinite ease-in-out;
    margin-bottom:20px;
}

@keyframes breathe{
    0%{transform:scale(1);}
    50%{transform:scale(1.3);}
    100%{transform:scale(1);}
}

h1{
    color:#1e3a5f;
}

p{
    color:#2c3e50;
}
</style>

</head>

<body>

<div class="calm-container">

    <div class="breath-circle">🧘</div>

    <h1>Calm Mode</h1>
    <p>Breathe in... Hold... Breathe out...</p>

</div>

</body>
</html>
